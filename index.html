<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | พิชามญชุ์ รอดมา</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            font-family: "Prompt", sans-serif;

            color: #173f5f;

            background: #f5faff;

        }

        /* ================= NAVBAR ================= */

        .navbar {

            height: 70px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            box-shadow: 0 2px 15px rgba(30, 80, 110, 0.08);

            position: relative;

            z-index: 10;

        }

        .logo {

            font-size: 21px;

            font-weight: 700;

            color: #245d83;

            text-decoration: none;

            letter-spacing: 2px;

        }

        nav {

            display: flex;

            gap: 28px;

        }

        nav a {

            color: #526f82;

            text-decoration: none;

            font-size: 14px;

            transition: 0.3s;

        }

        nav a:hover,

        nav a.active {

            color: #1e6797;

            font-weight: 600;

        }

        /* ================= COVER ================= */

        .cover {

            min-height: calc(100vh - 70px);

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(circle at 85% 20%, rgba(96, 166, 207, 0.20) 0, rgba(96, 166, 207, 0) 25%),

                radial-gradient(circle at 10% 85%, rgba(130, 190, 220, 0.18) 0, rgba(130, 190, 220, 0) 28%),

                linear-gradient(135deg, #edf7fd, #ffffff 55%, #e5f3fb);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 7%;

        }

        .cover-content {

            width: 100%;

            max-width: 1100px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 80px;

            position: relative;

            z-index: 3;

        }

        /* ================= TEXT ================= */

        .cover-text {

            flex: 1;

            max-width: 560px;

        }

        .small-title {

            margin: 0 0 12px;

            color: #3c82a9;

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 4px;

        }

        .cover-text h1 {

            margin: 0;

            font-size: clamp(45px, 5vw, 68px);

            line-height: 1.15;

            color: #173f5f;

        }

        .line {

            width: 85px;

            height: 5px;

            margin: 22px 0;

            background: #4389b4;

            border-radius: 20px;

        }

        .welcome {

            color: #607c8e;

            font-size: 17px;

            line-height: 1.8;

            margin-bottom: 20px;

        }

        .cover-text h2 {

            margin: 0 0 5px;

            color: #20597c;

            font-size: 30px;

        }

        .student {

            margin: 0 0 25px;

            color: #718898;

            font-size: 14px;

        }

        /* ================= BUTTON ================= */

        .cover-button {

            display: inline-block;

            padding: 12px 25px;

            background: #28698f;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 14px;

            box-shadow: 0 8px 20px rgba(40, 105, 143, 0.20);

            transition: 0.3s;

        }

        .cover-button:hover {

            transform: translateY(-3px);

            background: #174e70;

        }

        /* ================= PHOTO ================= */

        .cover-photo {

            width: 330px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

        }

        .photo-frame {

            width: 235px;

            height: 285px;

            padding: 10px;

            background: white;

            border: 4px solid #4d91b8;

            border-radius: 20px;

            box-shadow:

                0 15px 35px rgba(40, 90, 120, 0.18);

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 3;

        }

        .photo-frame img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            object-position: center;

            border-radius: 12px;

            background: #f3f8fb;

        }

        /* ================= PHOTO DECORATION ================= */

        .photo-frame::before {

            content: "";

            position: absolute;

            width: 45px;

            height: 45px;

            border-radius: 50%;

            border: 8px solid rgba(76, 145, 184, 0.12);

            top: -25px;

            right: -25px;

            z-index: -1;

        }

        .photo-frame::after {

            content: "";

            position: absolute;

            width: 18px;

            height: 18px;

            border-radius: 50%;

            background: rgba(65, 135, 175, 0.35);

            bottom: -25px;

            left: -25px;

        }

        /* ================= BACKGROUND DECORATION ================= */

        .circle {

            position: absolute;

            border-radius: 50%;

            z-index: 1;

        }

        .circle-1 {

            width: 330px;

            height: 330px;

            right: -120px;

            top: -120px;

            border: 45px solid rgba(65, 135, 175, 0.08);

        }

        .circle-2 {

            width: 220px;

            height: 220px;

            left: -100px;

            bottom: -100px;

            background: rgba(87, 157, 195, 0.08);

        }

        /* จุดตกแต่ง */

        .dot-pattern {

            position: absolute;

            width: 150px;

            height: 150px;

            right: 6%;

            bottom: 8%;

            background-image:

                radial-gradient(#4b8caf 2px, transparent 2px);

            background-size: 18px 18px;

            opacity: 0.25;

        }

        /* เส้นตกแต่ง */

        .decor-line {

            position: absolute;

            width: 180px;

            height: 2px;

            background: rgba(62, 133, 174, 0.18);

            transform: rotate(-35deg);

            left: 3%;

            top: 25%;

        }

        /* ================= FOOTER ================= */

        footer {

            position: absolute;

            bottom: 15px;

            left: 0;

            right: 0;

            text-align: center;

            color: #78909e;

            font-size: 12px;

            z-index: 4;

        }

        /* ================= MOBILE ================= */

        @media (max-width: 850px) {

            .navbar {

                height: auto;

                padding: 18px 20px;

                flex-direction: column;

                gap: 12px;

            }

            nav {

                gap: 13px;

                flex-wrap: wrap;

                justify-content: center;

            }

            nav a {

                font-size: 12px;

            }

            .cover {

                min-height: calc(100vh - 105px);

                padding: 40px 20px 70px;

            }

            .cover-content {

                flex-direction: column-reverse;

                gap: 30px;

                text-align: center;

            }

            .cover-text {

                max-width: 100%;

            }

            .line {

                margin: 18px auto;

            }

            .cover-text h1 {

                font-size: 43px;

            }

            .cover-text h2 {

                font-size: 27px;

            }

            .cover-photo {

                width: 260px;

            }

            .photo-frame {

                width: 200px;

                height: 245px;

            }

            .dot-pattern {

                right: -20px;

                bottom: 10%;

            }

            .decor-line {

                display: none;

            }

        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html" class="logo">

        PORTFOLIO

    </a>

    <nav>

        <a href="index.html" class="active">

        </a>

        <a href="profile.html">

        <a href="interest.html">

        </a>

        <a href="activities.html">

        </a>

        <a href="contact.html">

        </a>

    </nav>

</header>

<!-- ================= COVER ================= -->

<main class="cover">

    <!-- ตกแต่งพื้นหลัง -->

    <div class="circle circle-1"></div>

    <div class="circle circle-2"></div>

    <div class="dot-pattern"></div>

    <div class="decor-line"></div>

    <div class="cover-content">

        <!-- ข้อความ -->

        <section class="cover-text">

            <p class="small-title">

                MY PORTFOLIO

            </p>

            <h1>

                แฟ้มสะสมผลงาน

            </h1>

            <div class="line"></div>

            <p class="welcome">

                รวบรวมประวัติ ความสนใจ<br>

                กิจกรรม และประสบการณ์การเรียนรู้

            </p>

            <h2>

                พิชามญชุ์ รอดมา

            </h2>

            <p class="student">

                นักเรียนระดับชั้นมัธยมศึกษาตอนปลาย

            </p>

            <a href="profile.html" class="cover-button">

                ดูประวัติส่วนตัว →

            </a>

        </section>

        <!-- รูป -->

        <section class="cover-photo">

            <div class="photo-frame">

                <img

                    src="71C32957-C1D7-4CF0-8DD6-E4A524ECE2E8.png"

                    alt="รูปโปรไฟล์"

                >

            </div>

        </section>

    </div>

    <footer>

        © 2026 Pichamon Rodma | Portfolio

    </footer>

</main>

</body>

</html>
