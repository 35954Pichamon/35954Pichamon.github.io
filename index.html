<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>พิชามญชุ์ รอดมา | Portfolio</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap');

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        body {

            font-family: 'Prompt', sans-serif;

            background: #edf6fc;

            color: #234b68;

            min-height: 100vh;

        }

        /* ================= NAVBAR ================= */

        .navbar {

            height: 72px;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            box-shadow: 0 3px 18px rgba(40, 90, 130, 0.10);

            position: relative;

            z-index: 20;

        }

        .logo {

            text-decoration: none;

            color: #1e4d70;

            font-family: 'Kanit', sans-serif;

            font-size: 24px;

            font-weight: 600;

            letter-spacing: 3px;

        }

        nav {

            display: flex;

            gap: 30px;

        }

        nav a {

            text-decoration: none;

            color: #6b8294;

            font-size: 15px;

            transition: 0.3s;

        }

        nav a:hover,

        nav a.active {

            color: #2778ae;

        }

        .menu-btn {

            display: none;

            border: none;

            background: none;

            font-size: 27px;

            color: #245b7e;

        }

        /* ================= COVER ================= */

        .cover {

            min-height: calc(100vh - 72px);

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 45px 20px;

        }

        /* ================= DECORATION ================= */

        .circle {

            position: absolute;

            border-radius: 50%;

        }

        .circle-1 {

            width: 380px;

            height: 380px;

            background: #d8ecf9;

            left: -170px;

            top: 50px;

        }

        .circle-2 {

            width: 270px;

            height: 270px;

            background: #c9e4f4;

            right: -110px;

            bottom: 20px;

        }

        .circle-3 {

            width: 90px;

            height: 90px;

            border: 14px solid #d3e9f6;

            right: 12%;

            top: 85px;

        }

        .dot {

            position: absolute;

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #a9cee4;

        }

        .dot-1 {

            left: 15%;

            top: 22%;

        }

        .dot-2 {

            right: 18%;

            bottom: 25%;

        }

        .dot-3 {

            left: 20%;

            bottom: 15%;

        }

        /* ================= MAIN BOX ================= */

        .cover-box {

            width: min(1000px, 94%);

            min-height: 600px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 35px;

            position: relative;

            z-index: 5;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 55px 30px;

            border: 1px solid #d5e8f3;

            box-shadow:

                0 20px 55px rgba(39, 91, 126, 0.14);

        }

        /* มุมทั้ง 4 */

        .corner {

            position: absolute;

            width: 55px;

            height: 55px;

            border-color: #a8cde2;

        }

        .corner-tl {

            top: 24px;

            left: 24px;

            border-top: 3px solid;

            border-left: 3px solid;

            border-radius: 14px 0 0 0;

        }

        .corner-tr {

            top: 24px;

            right: 24px;

            border-top: 3px solid;

            border-right: 3px solid;

            border-radius: 0 14px 0 0;

        }

        .corner-bl {

            bottom: 24px;

            left: 24px;

            border-bottom: 3px solid;

            border-left: 3px solid;

            border-radius: 0 0 0 14px;

        }

        .corner-br {

            bottom: 24px;

            right: 24px;

            border-bottom: 3px solid;

            border-right: 3px solid;

            border-radius: 0 0 14px 0;

        }

        /* ================= TOP LINE ================= */

        .top-line {

            width: 70px;

            height: 4px;

            background: #4388b5;

            border-radius: 20px;

            margin-bottom: 22px;

        }

        /* ================= PHOTO ================= */

        .cover-image {

            width: 130px !important;

            height: 130px !important;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid #ffffff;

            box-shadow:

                0 8px 25px rgba(34, 83, 115, 0.20);

            display: block;

            margin-bottom: 20px;

        }

        /* ================= TEXT ================= */

        .subtitle {

            font-family: 'Kanit', sans-serif;

            font-size: 17px;

            letter-spacing: 5px;

            color: #6d93aa;

            margin-bottom: 8px;

        }

        .main-title {

            font-family: 'Kanit', sans-serif;

            font-size: clamp(55px, 9vw, 95px);

            font-weight: 600;

            letter-spacing: 7px;

            line-height: 1;

            color: #1f5279;

            margin-bottom: 20px;

        }

        .title-line {

            width: 250px;

            height: 2px;

            background: #bdd9e9;

            margin-bottom: 22px;

        }

        .name {

            font-family: 'Kanit', sans-serif;

            font-size: 29px;

            font-weight: 500;

            color: #234f6d;

            margin-bottom: 4px;

        }

        .student {

            color: #7b92a2;

            font-size: 16px;

            margin-bottom: 25px;

        }

        /* ================= TAGS ================= */

        .tags {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

        }

        .tag {

            padding: 7px 18px;

            border-radius: 30px;

            background: #edf7fc;

            border: 1px solid #c8e0ed;

            color: #3e7597;

            font-size: 14px;

        }

        /* ================= DESCRIPTION ================= */

        .welcome {

            max-width: 580px;

            color: #7b8f9d;

            font-size: 15px;

            line-height: 1.9;

        }

        /* ================= BOTTOM DECORATION ================= */

        .mini-line {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 25px;

        }

        .mini-line span {

            width: 25px;

            height: 3px;

            border-radius: 10px;

            background: #b5d5e7;

        }

        .mini-line span:nth-child(2) {

            width: 45px;

            background: #78abc8;

        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .navbar {

                padding: 0 25px;

            }

            nav {

                display: none;

            }

            .menu-btn {

                display: block;

            }

            .cover {

                padding: 30px 15px;

            }

            .cover-box {

                min-height: 560px;

                padding: 45px 20px;

            }

            .main-title {

                font-size: 52px;

                letter-spacing: 4px;

            }

            .name {

                font-size: 24px;

            }

            .cover-image {

                width: 120px !important;

                height: 120px !important;

            }

            .circle-1 {

                width: 240px;

                height: 240px;

                left: -130px;

            }

            .circle-2 {

                width: 180px;

                height: 180px;

                right: -90px;

            }

        }

    </style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">

            PORTFOLIO

        </a>

        <button class="menu-btn">

            ☰

        </button>

        <nav>

            <a href="index.html" class="active">

                หน้าแรก

            </a>

            <a href="profile.html">

                ประวัติส่วนตัว

            </a>

            <a href="interest.html">

                ความสนใจ

            </a>

            <a href="activities.html">

                กิจกรรมและผลงาน

            </a>

            <a href="contact.html">

                ติดต่อ

            </a>

        </nav>

    </header>

    <!-- ================= COVER ================= -->

    <main class="cover">

        <!-- ตกแต่งพื้นหลัง -->

        <div class="circle circle-1"></div>

        <div class="circle circle-2"></div>

        <div class="circle circle-3"></div>

        <div class="dot dot-1"></div>

        <div class="dot dot-2"></div>

        <div class="dot dot-3"></div>

        <!-- กล่องหน้าปก -->

        <section class="cover-box">

            <!-- มุมตกแต่ง -->

            <div class="corner corner-tl"></div>

            <div class="corner corner-tr"></div>

            <div class="corner corner-bl"></div>

            <div class="corner corner-br"></div>

            <!-- เส้นด้านบน -->

            <div class="top-line"></div>

            <!-- รูป -->

            <img

                src="71C32957-C1D7-4CF0-8DD6-E4A524ECE2E8.png"

                alt="พิชามญชุ์ รอดมา"

                class="cover-image"

            >

            <!-- หัวข้อ -->

            <p class="subtitle">

                STUDENT PORTFOLIO

            </p>

            <h1 class="main-title">

                PORTFOLIO

            </h1>

            <div class="title-line"></div>

            <!-- ชื่อ -->

            <h2 class="name">

                พิชามญชุ์ รอดมา

            </h2>

            <p class="student">

                แฟ้มสะสมผลงาน

            </p>

            <!-- ป้าย -->

            <div class="tags">

                <span class="tag">

                    Education

                </span>

                <span class="tag">

                    Activities

                </span>

                <span class="tag">

                    My Future

                </span>

            </div>

            <!-- คำอธิบาย -->

            <p class="welcome">

                แฟ้มสะสมผลงานที่รวบรวมประสบการณ์

                กิจกรรม ความสนใจ และผลงาน

                เพื่อสะท้อนการเรียนรู้และการพัฒนาตนเอง

            </p>

            <!-- เส้นตกแต่ง -->

            <div class="mini-line">

                <span></span>

                <span></span>

                <span></span>

            </div>

        </section>

    </main>

</body>

</html>
