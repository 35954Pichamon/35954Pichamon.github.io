<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | พิชามญชุ์ รอดมา</title>

    <link rel="stylesheet"

          href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap">

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            font-family: "Kanit", sans-serif;

            background: #f4faff;

            color: #23577c;

        }

        /* =========================

           NAVBAR

        ========================= */

        .navbar {

            height: 72px;

            margin: 22px 4%;

            padding: 0 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(255,255,255,0.95);

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(45, 100, 135, 0.08);

            position: relative;

            z-index: 10;

        }

        .logo {

            color: #28658c;

            text-decoration: none;

            font-size: 23px;

            font-weight: 600;

            letter-spacing: 2px;

        }

        nav {

            display: flex;

            align-items: center;

            gap: 32px;

        }

        nav a {

            color: #527489;

            text-decoration: none;

            font-size: 15px;

            padding: 9px 15px;

            border-radius: 25px;

            transition: 0.25s;

        }

        nav a:hover,

        nav a.active {

            color: #21618c;

            background: #e4f2fc;

        }

        /* =========================

           COVER

        ========================= */

        .cover {

            min-height: calc(100vh - 116px);

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            padding: 50px 8%;

        }

        .cover-content {

            width: 100%;

            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 70px;

            position: relative;

            z-index: 2;

        }

        /* =========================

           LEFT TEXT

        ========================= */

        .cover-text {

            flex: 1;

            max-width: 600px;

        }

        .small-title {

            margin: 0 0 12px;

            color: #4387ae;

            font-size: 17px;

            font-weight: 500;

            letter-spacing: 5px;

        }

        .cover-text h1 {

            margin: 0;

            color: #1e5478;

            font-size: clamp(45px, 5vw, 65px);

            line-height: 1.15;

            font-weight: 600;

        }

        .line {

            width: 75px;

            height: 5px;

            margin: 20px 0;

            background: #65a5ca;

            border-radius: 10px;

        }

        .welcome {

            margin: 0 0 20px;

            color: #607f91;

            font-size: 18px;

            line-height: 1.8;

        }

        .cover-text h2 {

            margin: 0;

            color: #245d80;

            font-size: 31px;

            font-weight: 500;

        }

        .student {

            margin: 5px 0 25px;

            color: #78909f;

            font-size: 15px;

        }

        /* =========================

           BUTTON

        ========================= */

        .cover-button {

            display: inline-block;

            padding: 12px 25px;

            background: #397ca5;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 15px;

            box-shadow: 0 7px 18px rgba(57,124,165,0.18);

            transition: 0.25s;

        }

        .cover-button:hover {

            background: #28678d;

            transform: translateY(-2px);

        }

        /* =========================

           PHOTO

        ========================= */

        .cover-photo {

            width: 350px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

        }

        .photo-frame {

            width: 245px;

            height: 310px;

            padding: 10px;

            background: white;

            border: 3px solid #72acd0;

            border-radius: 18px;

            box-shadow:

                0 15px 30px rgba(45, 100, 135, 0.15);

            position: relative;

        }

        .photo-frame img {

            width: 100%;

            height: 100%;

            display: block;

            /* สำคัญมาก

               รูปจะไม่โดนตัด */

            object-fit: contain;

            object-position: center;

            border-radius: 10px;

            background: #f5f9fc;

        }

        /* =========================

           เรียบ ๆ ตกแต่งข้างรูป

        ========================= */

        .photo-frame::before {

            content: "";

            position: absolute;

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 7px solid #d9edf8;

            top: -22px;

            right: -22px;

        }

        .photo-frame::after {

            content: "";

            position: absolute;

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #7fb6d6;

            bottom: -18px;

            left: -18px;

        }

        /* =========================

           BACKGROUND DECORATION

           เรียบ ๆ

        ========================= */

        .decor-circle-1 {

            position: absolute;

            width: 270px;

            height: 270px;

            border-radius: 50%;

            background: #e3f3fc;

            right: -110px;

            top: -90px;

            z-index: 0;

        }

        .decor-circle-2 {

            position: absolute;

            width: 190px;

            height: 190px;

            border-radius: 50%;

            background: #eaf6fc;

            left: -90px;

            bottom: -90px;

            z-index: 0;

        }

        .dots {

            position: absolute;

            width: 90px;

            height: 90px;

            right: 7%;

            bottom: 12%;

            background-image:

                radial-gradient(#78afd0 2px, transparent 2px);

            background-size: 16px 16px;

            opacity: 0.35;

        }

        /* =========================

           FOOTER

        ========================= */

        footer {

            position: absolute;

            bottom: 12px;

            left: 0;

            right: 0;

            text-align: center;

            color: #7895a5;

            font-size: 12px;

        }

        /* =========================

           MOBILE

        ========================= */

        @media (max-width: 850px) {

            .navbar {

                height: auto;

                margin: 12px;

                padding: 15px;

                flex-direction: column;

                gap: 10px;

            }

            nav {

                gap: 5px;

                flex-wrap: wrap;

                justify-content: center;

            }

            nav a {

                font-size: 12px;

                padding: 7px 10px;

            }

            .cover {

                min-height: calc(100vh - 150px);

                padding: 35px 20px 70px;

            }

            .cover-content {

                flex-direction: column-reverse;

                gap: 30px;

                text-align: center;

            }

            .cover-text {

                max-width: 100%;

            }

            .small-title {

                font-size: 14px;

            }

            .cover-text h1 {

                font-size: 42px;

            }

            .line {

                margin: 18px auto;

            }

            .cover-text h2 {

                font-size: 27px;

            }

            .cover-photo {

                width: 100%;

            }

            .photo-frame {

                width: 195px;

                height: 245px;

            }

            footer {

                bottom: 7px;

            }

        }

    </style>

</head>

<body>

<!-- =========================

     MENU

========================= -->

<header class="navbar">

    <a href="index.html" class="logo">

        PORTFOLIO

    </a>

    <nav>

        <a href="index.html" class="active">

            หน้าแรก

        </a>

        <a href="profile.html">

            ประวัติส่วนตัว

        </a>

        <a href="interest.html">

            ความสนใจ

        </a>

        <a href="activities.html">

            กิจกรรมและผลงาน

        </a>

        <a href="contact.html">

            ติดต่อ

        </a>

    </nav>

</header>

<!-- =========================

     หน้าปก

========================= -->

<main class="cover">

    <!-- ตกแต่งพื้นหลัง -->

    <div class="decor-circle-1"></div>

    <div class="decor-circle-2"></div>

    <div class="dots"></div>

    <div class="cover-content">

        <!-- ข้อความด้านซ้าย -->

        <section class="cover-text">

            <p class="small-title">

                MY PORTFOLIO

            </p>

            <h1>

                แฟ้มสะสมผลงาน

            </h1>

            <div class="line"></div>

            <p class="welcome">

                รวบรวมประวัติ ความสนใจ<br>

                กิจกรรม และประสบการณ์การเรียนรู้

            </p>

            <h2>

                พิชามญชุ์ รอดมา

            </h2>

            <p class="student">

                นักเรียนระดับชั้นมัธยมศึกษาตอนปลาย

            </p>

            <a href="profile.html" class="cover-button">

                ดูประวัติส่วนตัว →

            </a>

        </section>

        <!-- รูปด้านขวา -->

        <section class="cover-photo">

            <div class="photo-frame">

                <img

                    src="71C32957-C1D7-4CF0-8DD6-E4A524ECE2E8.png"

                    alt="รูปโปรไฟล์"

                >

            </div>

        </section>

    </div>

    <footer>

        © 2026 Pichamon Rodma | Portfolio

    </footer>

</main>

</body>

</html>
